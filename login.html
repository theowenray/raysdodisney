<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Rays Do Disney</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #0a1a3a 0%, #172b72 100%);
    }
    .login-wrap {
      text-align: center;
      padding: 20px;
    }
    .login-logo {
      max-width: 400px;
      width: 80%;
      margin-bottom: 40px;
      filter: drop-shadow(0 4px 20px rgba(0,0,0,.4));
    }
    .login-box {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 22px;
      padding: 36px 32px;
      max-width: 380px;
      width: 100%;
      margin: 0 auto;
      box-shadow: 0 18px 60px rgba(0,0,0,.3);
    }
    .login-box h2 {
      font-family: Georgia, serif;
      color: var(--blue);
      margin: 0 0 8px;
      font-size: 1.6rem;
    }
    .login-box p {
      color: var(--muted);
      margin: 0 0 24px;
      font-size: 0.95rem;
    }
    .login-box input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid rgba(23,43,114,.15);
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
    }
    .login-box input:focus {
      border-color: var(--blue);
    }
    .login-box button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      background: var(--gold);
      color: var(--blue);
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s;
    }
    .login-box button:hover {
      transform: scale(1.02);
    }
    .error-msg {
      color: #d63031;
      font-size: 0.9rem;
      margin-top: 12px;
      display: none;
    }
    .nav { display: none; }
  </style>
</head>
<body>

  <div class="login-wrap">
    <img class="login-logo" src="assets/hero/logo.png" alt="Rays Do Disney">
    <div class="login-box">
      <h2>Welcome!</h2>
      <p>Enter the family password to continue.</p>
      <form id="login-form">
        <input type="password" id="password" placeholder="Password" autocomplete="off">
        <button type="submit">Enter the Magic</button>
        <p class="error-msg" id="error-msg">Incorrect password. Try again!</p>
      </form>
    </div>
  </div>

  <script>
    // Change this password to whatever you want
    const SITE_PASSWORD = 'ohana';

    // If already authenticated, skip to home
    if (localStorage.getItem('rdd_auth') === 'true') {
      window.location.href = 'index.html';
    }

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const input = document.getElementById('password').value;
      if (input === SITE_PASSWORD) {
        localStorage.setItem('rdd_auth', 'true');
        window.location.href = 'index.html';
      } else {
        document.getElementById('error-msg').style.display = 'block';
        document.getElementById('password').value = '';
      }
    });
  </script>

</body>
</html>
